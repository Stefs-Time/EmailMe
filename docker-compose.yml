# MailHarbor — self-hosted stack (Ubuntu Server + Docker Compose).
#
#   cp .env.example .env   # fill in the database password, domain and SMTP details
#   docker compose up -d --build
#   docker compose logs portal | grep "setup code"    # then open https://$DOMAIN
#
# Services:
#   caddy   - HTTPS (automatic Let's Encrypt certificates)
#   portal  - MailHarbor (app + background sending/bounce worker)
#   db      - PostgreSQL (internal network only, never published)
#   backup  - nightly verified pg_dump with retention (optional S3 copy)
#
# Only ports 80 and 443 are exposed to the internet.

name: mailharbor

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailharbor
      POSTGRES_USER: mailharbor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailharbor -d mailharbor"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]

  portal:
    build: .
    image: mailharbor-portal:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mailharbor:${POSTGRES_PASSWORD}@db:5432/mailharbor
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      # Optional break-glass administrator (re-applied on every start).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: ${TZ:-Africa/Johannesburg}
    # egress: the portal must reach your SMTP server and IMAP bounce mailbox.
    networks: [internal, egress]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [portal]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal, egress]

  backup:
    # Same image as the portal; runs scripts/backup.js daily (pg_dump, verify,
    # retention, heartbeat shown on System health).
    image: mailharbor-portal:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "scripts/backup.js", "--loop"]
    user: "0:0"
    environment:
      BACKUP_DATABASE_URL: postgres://mailharbor:${POSTGRES_PASSWORD}@db:5432/mailharbor
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      TZ: ${TZ:-Africa/Johannesburg}
    volumes:
      - ./backups:/backups
    networks: [internal, egress]

networks:
  internal:
    internal: true
  egress: {}

volumes:
  db-data:
  caddy-data:
  caddy-config:
